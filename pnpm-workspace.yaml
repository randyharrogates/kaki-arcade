# Globs only pick up folders that hold a package.json, so tools/blender and other
# non-JavaScript folders are ignored. tools/check_workspace.mjs reads this list too: it
# understands "folder/*" and plain folder names.
packages:
  - "apps/*"
  - "packages/*"
  - "games/*"
  - "content/*"
  - "tools/*"

# Refuse to install on a Node version outside "engines" in package.json. The same setting is in
# .npmrc for tools that read it there.
engineStrict: true

# Packages allowed to run install scripts (each fetches its own platform binary). Anything not
# listed is refused. D-061.
allowBuilds:
  esbuild: true
  workerd: true
